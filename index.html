<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול לימודים אישי - אנדריי</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Heebo -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Heebo', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-6">

    <!-- מסך התחברות (סיסמה) -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
        <div class="glass text-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-white/20 text-center">
            <div class="w-16 h-16 bg-indigo-600 text-white rounded-full flex items-center justify-content mx-auto mb-4 text-2xl shadow-lg">
                <i class="fa-solid fa-lock m-auto"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">אזור מוגן בסיסמה</h2>
            <p class="text-sm text-slate-500 mb-6">הכנס סיסמה כדי להיכנס למערכת האישית</p>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="password-input" placeholder="הכנס סיסמה..." required
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-600 text-center text-lg">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg cursor-pointer">
                    כניסה למערכת
                </button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden">סיסמה שגויה, נסה שוב.</p>
        </div>
    </div>

    <!-- תוכן האתר הראשי (מוסתר עד להתחברות מוצלחת) -->
    <div id="main-content" class="w-full max-w-4xl mx-auto space-y-6 hidden">
        
        <!-- כותרת ראשית -->
        <header class="glass text-slate-800 p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-indigo-900">מערכת ניהול לימודים אישית 📚</h1>
                <p class="text-sm text-slate-500">מסונכרן בזמן אמת לענן (Firebase)</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="current-time" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl font-medium text-sm">--:--:--</span>
                <button onclick="logout()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket ml-1"></i> התנתק
                </button>
            </div>
        </header>

        <!-- אזור נוכחות (כניסה ויציאה) -->
        <section class="glass text-slate-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-indigo-900">
                <i class="fa-solid fa-business-time"></i> דיווח נוכחות לבית הספר
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button onclick="reportAttendance('הגעתי לבית הספר 🏫')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-4 rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-3 cursor-pointer">
                    <i class="fa-solid fa-door-open text-xl"></i> הגעתי לבית הספר
                </button>
                <button onclick="reportAttendance('יצאתי מבית הספר 🏃‍♂️')" class="bg-amber-600 hover:bg-amber-700 text-white font-bold p-4 rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-3 cursor-pointer">
                    <i class="fa-solid fa-person-walking-arrow-right text-xl"></i> יצאתי מבית הספר
                </button>
            </div>
            <div id="attendance-status" class="mt-4 text-center text-sm font-medium text-slate-600"></div>
        </section>

        <!-- אזור ניהול שיעורי בית -->
        <section class="glass text-slate-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-indigo-900">
                <i class="fa-solid fa-book"></i> עדכון שיעורי בית ומשימות
            </h2>
            <form onsubmit="addHomework(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <input type="text" id="hw-subject" placeholder="מקצוע (לדוגמה: מתמטיקה)" required
                        class="px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-600">
                    <input type="date" id="hw-date" required
                        class="px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-600">
                </div>
                <textarea id="hw-desc" placeholder="תיאור המשימה / שיעורי הבית..." rows="2" required
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-600"></textarea>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md cursor-pointer">
                    <i class="fa-solid fa-plus ml-1"></i> הוסף שיעורי בית ושלח עדכון
                </button>
            </form>

            <div class="mt-6">
                <h3 class="font-bold text-slate-700 mb-3">שיעורי בית פעילים:</h3>
                <div id="homework-list" class="space-y-3 max-h-60 overflow-y-auto">
                    <!-- הנתונים יטענו לכאן אוטומטית מ-Firebase -->
                    <p class="text-slate-400 text-center py-4">טוען נתונים מהענן...</p>
                </div>
            </div>
        </section>
    </div>

    <!-- פוטר -->
    <footer class="text-center text-slate-400 text-xs mt-8">
        נבנה באהבה עבור אנדריי • מוגן ומסונכרן לענן 🚀
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // הגדרות ה-Firebase שלך
        const firebaseConfig = {
            apiKey: "AIzaSyDNUM7sknpTo6A0MYKvqfzrQdwhShFdGIM",
            authDomain: "limudim-a119e.firebaseapp.com",
            projectId: "limudim-a119e",
            storageBucket: "limudim-a119e.firebasestorage.app",
            messagingSenderId: "836667820",
            appId: "1:836667820:web:5ea0bc069b7044e83b1209",
            measurementId: "G-66PXBR586W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // שעון חי
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString('he-IL');
        }, 1000);

        // בדיקת סיסמה (שמור ב-SessionStorage כדי לא להקליד כל פעם רענון)
        window.handleLogin = function(event) {
            event.preventDefault();
            const pass = document.getElementById('password-input').value;
            // תוכל לשנות כאן את הסיסמה למה שתרצה (כרגע מוגדרת כ- 1234)
            if (pass === "1234") {
                sessionStorage.setItem('isLoggedIn', 'true');
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                loadHomework();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        window.logout = function() {
            sessionStorage.removeItem('isLoggedIn');
            location.reload();
        }

        // בדיקה אם כבר התחבר
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            loadHomework();
        }

        // דיווח נוכחות ושליחת אינדיקציה
        window.reportAttendance = async function(type) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('he-IL');
            const dateStr = now.toLocaleDateString('he-IL');
            
            try {
                // שמירה בבסיס הנתונים (Firebase)
                await addDoc(collection(db, "attendance"), {
                    type: type,
                    date: dateStr,
                    time: timeStr,
                    timestamp: new Date()
                });
                document.getElementById('attendance-status').innerHTML = `<span class="text-emerald-600 font-bold">✓ דווח בהצלחה: ${type} בתאריך ${dateStr} בשעה ${timeStr}</span>`;
            } catch (e) {
                console.error("שגיאה בשמירת נוכחות: ", e);
                alert("שגיאה בשמירת הנתונים לענן.");
            }
        }

        // הוספת שיעורי בית לענן
        window.addHomework = async function(event) {
            event.preventDefault();
            const subject = document.getElementById('hw-subject').value;
            const date = document.getElementById('hw-date').value;
            const desc = document.getElementById('hw-desc').value;

            try {
                await addDoc(collection(db, "homework"), {
                    subject,
                    date,
                    desc,
                    timestamp: new Date()
                });
                document.getElementById('hw-subject').value = '';
                document.getElementById('hw-date').value = '';
                document.getElementById('hw-desc').value = '';
                alert("שיעורי הבית נוספו בהצלחה וזמינים כעת מכל מכשיר!");
            } catch (e) {
                console.error("שגיאה בהוספת שיעורי בית: ", e);
                alert("שגיאה בשמירה לענן.");
            }
        }

        // טעינת שיעורי בית בזמן אמת מ-Firebase
        function loadHomework() {
            const hwListContainer = document.getElementById('homework-list');
            const q = query(collection(db, "homework"), orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                hwListContainer.innerHTML = '';
                if (snapshot.empty) {
                    hwListContainer.innerHTML = '<p class="text-slate-400 text-center py-2">אין שיעורי בית כרגע.</p>';
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const item = document.createElement('div');
                    item.className = "bg-white/80 border border-slate-200 p-4 rounded-xl flex justify-between items-center shadow-sm";
                    item.innerHTML = `
                        <div>
                            <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded-md ml-2">${data.subject}</span>
                            <span class="text-sm font-semibold text-slate-800">${data.desc}</span>
                            <div class="text-xs text-slate-400 mt-1">לשρריך לתאריך: ${data.date}</div>
                        </div>
                        <button onclick="deleteHomework('${docSnap.id}')" class="text-rose-500 hover:text-rose-700 text-sm p-2 cursor-pointer">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                    hwListContainer.appendChild(item);
                });
            });
        }

        // מחיקת שיעורי בית
        window.deleteHomework = async function(id) {
            if (confirm("האם למחוק את שיעורי הבית?")) {
                try {
                    await deleteDoc(doc(db, "homework", id));
                } catch (e) {
                    console.error("שגיאה במחיקה: ", e);
                }
            }
        }
    </script>
</body>
</html>
